<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with rounded corners -->
  <rect width="1024" height="1024" rx="200" fill="white"/>
  
  <!-- Wallet icon -->
  <g transform="translate(200, 200)">
    <!-- Wallet body -->
    <rect x="100" y="150" width="424" height="300" rx="40" fill="#1E40AF"/>
    
    <!-- Wallet fold -->
    <rect x="100" y="150" width="424" height="80" rx="40" fill="#3B82F6"/>
    
    <!-- Wallet card slot -->
    <rect x="150" y="200" width="324" height="200" rx="20" fill="#1E40AF"/>
    
    <!-- Card inside wallet -->
    <rect x="170" y="220" width="284" height="160" rx="15" fill="white"/>
    
    <!-- Card details -->
    <rect x="200" y="250" width="200" height="20" rx="10" fill="#E5E7EB"/>
    <rect x="200" y="290" width="150" height="15" rx="7" fill="#E5E7EB"/>
    <rect x="200" y="320" width="100" height="15" rx="7" fill="#E5E7EB"/>
    
    <!-- Wallet clasp -->
    <circle cx="300" cy="150" r="30" fill="#F59E0B"/>
    <circle cx="300" cy="150" r="20" fill="#FCD34D"/>
  </g>
</svg>
